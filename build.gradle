plugins {
	id 'fabric-loom' version '1.16.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Immersive Portals / Seamless Portals fork maven (Modrinth maven mirrors most fabric mods)
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.terraformersmc.com/releases/" } // cloth-config (imm ptl dependency)
	mavenCentral()
}

loom {
	// no per-remapping-namespace config needed beyond the `mappings`
	// dependency below — 26.2 has no intermediary/yarn layer to configure
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.2 exposes Mojang mappings natively (no Yarn), but Loom still
	// requires the `mappings` configuration to be populated — this is the
	// Mojmap equivalent of a Yarn artifact, confirmed via Fabric's own
	// mapping-migration docs (loom.officialMojangMappings()).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Seamless Portals (Immersive Portals fork) - bundles its own cloth-config jar-in-jar
	modImplementation files("libs/seamlessportals-fabric-1_0_0.jar")
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
